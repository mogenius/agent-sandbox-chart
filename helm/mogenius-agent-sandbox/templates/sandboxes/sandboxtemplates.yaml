{{- /*
The default SandboxTemplate. The pod spec is assembled from the template's flat
values (image, port, probes, storage, …) plus free-form podSpecExtra /
containerExtra for anything not modelled. Additional templates are managed as
standalone objects by the platform UI (MOG-4749 / MOG-4756), not here.
*/ -}}
{{- $root := . }}
{{- $sb := .Values.sandboxes }}
{{- $t := $sb.template }}
{{- $np := $sb.networkPolicy }}
{{- $name := default "default" $t.name }}
{{- $rtc := default $sb.runtimeClassName $t.runtimeClassName }}
{{- $containerName := default "sandbox" $t.containerName }}
{{- $port := int (default 0 $t.port) }}
{{- /* Volumes and mounts from the modelled values come first, the ones from the
extras are appended, so both can be used without duplicate keys. */}}
{{- $mounts := list }}
{{- if and $t.storage $t.storage.enabled $t.storage.mountPath }}
{{- $mounts = append $mounts (dict "name" "workspace" "mountPath" $t.storage.mountPath) }}
{{- end }}
{{- $volumes := list }}
{{- with $t.shmSizeLimit }}
{{- $mounts = append $mounts (dict "name" "dshm" "mountPath" "/dev/shm") }}
{{- $volumes = append $volumes (dict "name" "dshm" "emptyDir" (dict "medium" "Memory" "sizeLimit" .)) }}
{{- end }}
{{- $containerExtra := default dict $t.containerExtra }}
{{- $podSpecExtra := default dict $t.podSpecExtra }}
{{- $mounts = concat $mounts (default list $containerExtra.volumeMounts) }}
{{- $volumes = concat $volumes (default list $podSpecExtra.volumes) }}
{{- $containerExtra = omit $containerExtra "volumeMounts" }}
{{- $podSpecExtra = omit $podSpecExtra "volumes" }}
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: {{ $name }}
  namespace: {{ include "mogenius-agent-sandbox.sandboxNamespace" $root }}
  labels:
    {{- include "mogenius-agent-sandbox.labels" $root | nindent 4 }}
    mogenius.io/sandbox-profile: {{ $name }}
spec:
  podTemplate:
    spec:
      {{- with $rtc }}
      runtimeClassName: {{ . }}
      {{- end }}
      serviceAccountName: {{ $sb.serviceAccount.name }}
      automountServiceAccountToken: false
      {{- with $t.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $containerName }}
          image: {{ required "sandboxes.template.image is required" $t.image }}
          {{- with $t.imagePullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          {{- with $t.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $t.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $t.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if gt $port 0 }}
          ports:
            - containerPort: {{ $port }}
              name: http
              protocol: TCP
          {{- if and $t.probes $t.probes.enabled }}
          readinessProbe:
            httpGet:
              path: {{ default "/" $t.probes.path | quote }}
              port: {{ $port }}
            initialDelaySeconds: 0
            periodSeconds: 1
          livenessProbe:
            httpGet:
              path: {{ default "/" $t.probes.path | quote }}
              port: {{ $port }}
            initialDelaySeconds: 2
            periodSeconds: 10
          {{- end }}
          {{- end }}
          {{- with $t.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $t.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $mounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $containerExtra }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
      restartPolicy: {{ default "OnFailure" $t.restartPolicy }}
      {{- with $volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $podSpecExtra }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
  service: {{ $sb.service }}
  {{- if $np.managed }}
  networkPolicyManagement: Managed
  {{- if $np.explicit }}
  networkPolicy:
    {{- include "mogenius-agent-sandbox.sandboxNetworkPolicy" $root | trim | nindent 4 }}
  {{- end }}
  {{- else }}
  networkPolicyManagement: Unmanaged
  {{- end }}
  envVarsInjectionPolicy: Disallowed
  failedPodPolicy: Retain
  {{- if not (and $t.storage $t.storage.enabled) }}
  volumeClaimTemplatesPolicy: Disallowed
  {{- else }}
  volumeClaimTemplatesPolicy: Overrides
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $t.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ default "1Gi" $t.storage.size }}
  {{- end }}
