{{- /*
The warm pool for the default SandboxTemplate. Rendered even at 0 replicas:
SandboxClaims reference the pool, so it has to exist for the template to be
claimable at all. replicas > 0 keeps sandboxes pre-warmed so a claim binds in
seconds instead of waiting for a pod to start.
*/ -}}
{{- $root := . }}
{{- $sb := .Values.sandboxes }}
{{- $t := $sb.template }}
{{- $wp := default (dict) $sb.warmPool }}
{{- $name := default "default" $t.name }}
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: {{ $name }}
  namespace: {{ include "mogenius-agent-sandbox.sandboxNamespace" $root }}
  labels:
    {{- include "mogenius-agent-sandbox.labels" $root | nindent 4 }}
    mogenius.io/sandbox-profile: {{ $name }}
spec:
  replicas: {{ int (default 0 $wp.replicas) }}
  sandboxTemplateRef:
    name: {{ $name }}
  {{- with $wp.updateStrategy }}
  updateStrategy:
    type: {{ . }}
  {{- end }}
