name: Build main Image

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sandbox-default:
    uses: mogenius/github-actions/.github/workflows/build-multiarch.yml@42a618fc6a3360f2856da4f3400ca63fd72caa74 # v1.10.1
    secrets: inherit
    with:
      version: "main"
      image: ghcr.io/mogenius/agent-sandbox-chart/sandbox-default
      dockerfile: images/sandbox-default/Dockerfile
      architectures: amd64,arm64
      push_latest: false

  build-sandbox-opencode:
    uses: mogenius/github-actions/.github/workflows/build-multiarch.yml@42a618fc6a3360f2856da4f3400ca63fd72caa74 # v1.10.1
    secrets: inherit
    with:
      version: "main"
      image: ghcr.io/mogenius/agent-sandbox-chart/sandbox-opencode
      dockerfile: images/sandbox-opencode/Dockerfile
      architectures: amd64,arm64
      push_latest: false

  # Built on the sandbox-default image of this push.
  build-sandbox-platform-test:
    needs: [build-sandbox-default]
    uses: mogenius/github-actions/.github/workflows/build-multiarch.yml@42a618fc6a3360f2856da4f3400ca63fd72caa74 # v1.10.1
    secrets: inherit
    with:
      version: "main"
      image: ghcr.io/mogenius/agent-sandbox-chart/sandbox-platform-test
      dockerfile: images/sandbox-platform-test/Dockerfile
      architectures: amd64,arm64
      push_latest: false
      build_args: |
        BASE_VERSION=main
