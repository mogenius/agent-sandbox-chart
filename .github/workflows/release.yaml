name: Build, Package, Release (Production)

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

env:
  REGISTRY: ghcr.io
  HELMNAME: "mogenius-agent-sandbox"

jobs:
  build-image:
    uses: mogenius/github-actions/.github/workflows/build-multiarch.yml@3c8497d69c31bf66fc03e5df6b37bbda428ff220 # v1.10.5
    secrets: inherit
    with:
      version: ${{ github.ref_name }}
      image: ghcr.io/mogenius/agent-sandbox-chart/sandbox-default
      dockerfile: images/sandbox-default/Dockerfile
      architectures: amd64,arm64
      push_latest: true

  build-image-opencode:
    uses: mogenius/github-actions/.github/workflows/build-multiarch.yml@3c8497d69c31bf66fc03e5df6b37bbda428ff220 # v1.10.5
    secrets: inherit
    with:
      version: ${{ github.ref_name }}
      image: ghcr.io/mogenius/agent-sandbox-chart/sandbox-opencode
      dockerfile: images/sandbox-opencode/Dockerfile
      architectures: amd64,arm64
      push_latest: true

  # Built on the sandbox-default image of the same release.
  build-image-platform-test:
    needs: [build-image]
    uses: mogenius/github-actions/.github/workflows/build-multiarch.yml@3c8497d69c31bf66fc03e5df6b37bbda428ff220 # v1.10.5
    secrets: inherit
    with:
      version: ${{ github.ref_name }}
      image: ghcr.io/mogenius/agent-sandbox-chart/sandbox-platform-test
      dockerfile: images/sandbox-platform-test/Dockerfile
      architectures: amd64,arm64
      push_latest: true
      build_args: |
        BASE_VERSION=${{ github.ref_name }}

  helm-publish:
    needs: [build-image, build-image-opencode, build-image-platform-test]
    uses: mogenius/github-actions/.github/workflows/helm-publish.yml@3c8497d69c31bf66fc03e5df6b37bbda428ff220 # v1.10.5
    secrets:
      APP_ID: ${{ secrets.RELEASE_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_SECRET }}
    with:
      chart-path: helm/mogenius-agent-sandbox
      version: ${{ github.ref_name }}
      channel: public
      pre-package: |
        sed -i "s|ghcr\.io/mogenius/agent-sandbox-chart/sandbox-default:[^ ]*|ghcr.io/mogenius/agent-sandbox-chart/sandbox-default:${{ github.ref_name }}|g" values.yaml
        sed -i "s|ghcr\.io/mogenius/agent-sandbox-chart/sandbox-opencode:[^ ]*|ghcr.io/mogenius/agent-sandbox-chart/sandbox-opencode:${{ github.ref_name }}|g" values.yaml
        sed -i "s|ghcr\.io/mogenius/agent-sandbox-chart/sandbox-platform-test:[^ ]*|ghcr.io/mogenius/agent-sandbox-chart/sandbox-platform-test:${{ github.ref_name }}|g" values.yaml

  helm-oci:
    needs: [build-image, build-image-opencode, build-image-platform-test]
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package, push to OCI, and sign
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          sed -i "s|ghcr\.io/mogenius/agent-sandbox-chart/sandbox-default:[^ ]*|ghcr.io/mogenius/agent-sandbox-chart/sandbox-default:${VERSION}|g" helm/mogenius-agent-sandbox/values.yaml
          sed -i "s|ghcr\.io/mogenius/agent-sandbox-chart/sandbox-opencode:[^ ]*|ghcr.io/mogenius/agent-sandbox-chart/sandbox-opencode:${VERSION}|g" helm/mogenius-agent-sandbox/values.yaml
          sed -i "s|ghcr\.io/mogenius/agent-sandbox-chart/sandbox-platform-test:[^ ]*|ghcr.io/mogenius/agent-sandbox-chart/sandbox-platform-test:${VERSION}|g" helm/mogenius-agent-sandbox/values.yaml

          helm package -d /tmp/ ./helm/mogenius-agent-sandbox --version "${VERSION}"

          CHART_DIGEST=$(helm push "/tmp/${HELMNAME}-${VERSION}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/helm-charts" 2>&1 | grep "Digest: sha256:" | awk '{print $2}')

          if [ -z "${CHART_DIGEST}" ]; then
            echo "Failed to extract chart digest"
            exit 1
          fi
          echo "Chart digest: ${CHART_DIGEST}"

          cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY_OWNER}/helm-charts/${HELMNAME}@${CHART_DIGEST}"

  update-docs:
    needs: [build-image, build-image-opencode, build-image-platform-test]
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_SECRET }}

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Update Chart.yaml and values.yaml
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          sed -i "s/^version:.*/version: ${VERSION}/" helm/mogenius-agent-sandbox/Chart.yaml
          sed -i "s|ghcr\.io/mogenius/agent-sandbox-chart/sandbox-default:[^ ]*|ghcr.io/mogenius/agent-sandbox-chart/sandbox-default:${VERSION}|g" helm/mogenius-agent-sandbox/values.yaml
          sed -i "s|ghcr\.io/mogenius/agent-sandbox-chart/sandbox-opencode:[^ ]*|ghcr.io/mogenius/agent-sandbox-chart/sandbox-opencode:${VERSION}|g" helm/mogenius-agent-sandbox/values.yaml
          sed -i "s|ghcr\.io/mogenius/agent-sandbox-chart/sandbox-platform-test:[^ ]*|ghcr.io/mogenius/agent-sandbox-chart/sandbox-platform-test:${VERSION}|g" helm/mogenius-agent-sandbox/values.yaml
          git add helm/mogenius-agent-sandbox/Chart.yaml helm/mogenius-agent-sandbox/values.yaml

      - name: Run helm-docs
        uses: losisin/helm-docs-github-action@9e0787c426fdec38be6288bb5c0559dcb388412c # v2.0.1
        with:
          chart-search-root: helm/mogenius-agent-sandbox

      - name: Commit and push
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          git add helm/mogenius-agent-sandbox/README.md || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update Chart.yaml and documentation for version ${VERSION} [skip ci]"
            git pull --rebase
            git push origin main
          fi
